<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Study Desk — Shop</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar" id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <div>
        <h1>Everything for the desk</h1>
        <p>Gear for coding, studying, and getting through exam season.</p>
      </div>
      <input class="search-box" id="searchInput" type="text" placeholder="Search products…" />
    </div>

    <div class="filter-row" id="filterRow">
      <button class="chip active" data-category="">All</button>
    </div>

    <div class="grid" id="productGrid"></div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
